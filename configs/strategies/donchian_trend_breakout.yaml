name: donchian_trend_breakout
version: 1.0.0
enabled: true
market:
  provider: binance
  symbol: BTC/USDT
  timeframe: 1h
parameters:
  trend_filter: ema_slope
  trend_length: 200
  fast_length: 50
  slope_lookback: 5
  atr_length: 14
  atr_stop_multiplier: 2.0
  reward_risk: 2.0
  exit_method: risk
  exit_length: 10
  breakout_length: 40
risk:
  risk_per_trade_pct: 1.0
  max_position_pct: 25.0
  max_exposure_pct: 100.0
  stop_method: atr
  atr_period: 14
  atr_multiplier: 2.0
  risk_reward: 2.0
  sizing_method: stop_risk
  stop_enabled: true
  take_profit_enabled: true
  trailing_atr_multiplier: null
  trailing_basis: close
  max_holding_bars: null
